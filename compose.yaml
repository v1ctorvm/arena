services:
  postgres:
    image: postgres:17
    container_name: arena-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - arena_postgres_data:/var/lib/postgresql/data

volumes:
  arena_postgres_data: